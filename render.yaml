databases:
  - name: productos-db
    databaseName: productos_db
    user: postgres
    plan: free

services:
  - type: web
    name: productos-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: productos-db
          property: connectionString
      - key: NODE_ENV
        value: production
